<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 28px sans-serif; fill: #2c3e50; }
    .step { font: bold 18px sans-serif; fill: #ecf0f1; }
    .step-box { fill: #3498db; stroke: #2980b9; stroke-width: 2; rx: 10; ry: 10; }
    .connector { stroke: #7f8c8d; stroke-width: 3; stroke-dasharray: 5,5; }
    .arrow { stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
    .description { font: 14px sans-serif; fill: #34495e; }
    .highlight { fill: #f1c40f; stroke: #f39c12; stroke-width: 2; rx: 8; ry: 8; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="50" text-anchor="middle" class="title">Course Workflow Diagram</text>

  <!-- Step 1 -->
  <rect x="300" y="80" width="300" height="60" class="step-box"/>
  <text x="450" y="118" text-anchor="middle" class="step">1. Introduction to Physical AI</text>
  <text x="450" y="140" text-anchor="middle" class="description">(Core Concepts & Fundamentals)</text>

  <!-- Arrow -->
  <line x1="450" y1="140" x2="450" y2="170" class="arrow"/>

  <!-- Step 2 -->
  <rect x="300" y="170" width="300" height="60" class="step-box"/>
  <text x="450" y="208" text-anchor="middle" class="step">2. ROS 2 Foundation</text>
  <text x="450" y="230" text-anchor="middle" class="description">(Communication & Middleware)</text>

  <!-- Arrow -->
  <line x1="450" y1="230" x2="450" y2="260" class="arrow"/>

  <!-- Step 3 -->
  <rect x="300" y="260" width="300" height="60" class="step-box"/>
  <text x="450" y="298" text-anchor="middle" class="step">3. Simulation Environments</text>
  <text x="450" y="320" text-anchor="middle" class="description">(Isaac Sim & Gazebo)</text>

  <!-- Arrow -->
  <line x1="450" y1="320" x2="450" y2="350" class="arrow"/>

  <!-- Step 4 -->
  <rect x="300" y="350" width="300" height="60" class="step-box"/>
  <text x="450" y="388" text-anchor="middle" class="step">4. Isaac Modules</text>
  <text x="450" y="410" text-anchor="middle" class="description">(Navigation & Manipulation)</text>

  <!-- Arrow -->
  <line x1="450" y1="410" x2="450" y2="440" class="arrow"/>

  <!-- Step 5 -->
  <rect x="300" y="440" width="300" height="60" class="step-box"/>
  <text x="450" y="478" text-anchor="middle" class="step">5. Vision Language Action (VLA)</text>
  <text x="450" y="500" text-anchor="middle" class="description">(Perception & Decision Making)</text>

  <!-- Arrow -->
  <line x1="450" y1="500" x2="450" y2="530" class="arrow"/>

  <!-- Step 6 -->
  <rect x="300" y="530" width="300" height="60" class="step-box"/>
  <text x="450" y="568" text-anchor="middle" class="step">6. Integration & Testing</text>
  <text x="450" y="590" text-anchor="middle" class="description">(System Integration)</text>

  <!-- Loop back arrow -->
  <path d="M 600 560 Q 700 560 700 320 Q 700 80 450 80" class="connector" fill="none"/>
  <text x="680" y="200" text-anchor="middle" class="description">Iterative</text>
  <text x="680" y="220" text-anchor="middle" class="description">Development</text>
  <polygon points="455,85 445,85 450,75" fill="#7f8c8d"/>

  <!-- Feedback loop highlight -->
  <rect x="650" y="70" width="100" height="100" class="highlight"/>
  <text x="700" y="100" text-anchor="middle" class="description">Feedback</text>
  <text x="700" y="120" text-anchor="middle" class="description">&amp; Refinement</text>

  <!-- Capstone Project -->
  <rect x="150" y="620" width="600" height="60" fill="#2ecc71" stroke="#27ae60" stroke-width="2" rx="10" ry="10"/>
  <text x="450" y="650" text-anchor="middle" class="step" fill="#ffffff">Capstone Project: Complete Humanoid Robot System</text>
  <text x="450" y="670" text-anchor="middle" class="description">Applying all modules in integrated system</text>

  <!-- Connection to capstone -->
  <line x1="450" y1="590" x2="450" y2="620" class="arrow"/>
</svg>