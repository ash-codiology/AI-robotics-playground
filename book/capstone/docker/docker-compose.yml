# book/capstone/docker/docker-compose.yml
# Docker Compose configuration for the Capstone Project

version: '3.8'

services:
  robot_system:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: physical-ai-robotics-capstone:latest
    privileged: true
    network_mode: host
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
      - /usr/bin/nvidia-container-runtime:/usr/bin/nvidia-container-runtime
    command: bash -c "source /opt/ros/humble/setup.bash && source /ros2_ws/install/setup.bash && ros2 launch physical_ai_robotics_textbook capstone_launch.py"
