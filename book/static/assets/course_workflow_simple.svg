<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 20px sans-serif; fill: #2c3e50; }
    .step { font: bold 14px sans-serif; fill: #ffffff; }
    .step-box { fill: #3498db; stroke: #2980b9; stroke-width: 1; rx: 8; ry: 8; }
    .arrow { stroke: #7f8c8d; stroke-width: 2; marker-end: url(#arrowhead); }
    .description { font: 12px sans-serif; fill: #34495e; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d" />
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" class="title">Course Workflow Diagram</text>

  <!-- Step 1 -->
  <rect x="250" y="50" width="300" height="50" class="step-box"/>
  <text x="400" y="75" text-anchor="middle" class="step">1. Introduction to Physical AI</text>
  <text x="400" y="95" text-anchor="middle" class="description">(Core Concepts)</text>

  <!-- Arrow -->
  <line x1="400" y1="100" x2="400" y2="130" class="arrow"/>

  <!-- Step 2 -->
  <rect x="250" y="130" width="300" height="50" class="step-box"/>
  <text x="400" y="155" text-anchor="middle" class="step">2. ROS 2 Foundation</text>
  <text x="400" y="175" text-anchor="middle" class="description">(Communication)</text>

  <!-- Arrow -->
  <line x1="400" y1="180" x2="400" y2="210" class="arrow"/>

  <!-- Step 3 -->
  <rect x="250" y="210" width="300" height="50" class="step-box"/>
  <text x="400" y="235" text-anchor="middle" class="step">3. Simulation Environments</text>
  <text x="400" y="255" text-anchor="middle" class="description">(Isaac Sim)</text>

  <!-- Arrow -->
  <line x1="400" y1="260" x2="400" y2="290" class="arrow"/>

  <!-- Step 4 -->
  <rect x="250" y="290" width="300" height="50" class="step-box"/>
  <text x="400" y="315" text-anchor="middle" class="step">4. Isaac Modules</text>
  <text x="400" y="335" text-anchor="middle" class="description">(Navigation)</text>

  <!-- Arrow -->
  <line x1="400" y1="340" x2="400" y2="370" class="arrow"/>

  <!-- Step 5 -->
  <rect x="250" y="370" width="300" height="50" class="step-box"/>
  <text x="400" y="395" text-anchor="middle" class="step">5. Vision Language Action</text>
  <text x="400" y="415" text-anchor="middle" class="description">(VLA)</text>

  <!-- Arrow -->
  <line x1="400" y1="420" x2="400" y2="450" class="arrow"/>

  <!-- Step 6 -->
  <rect x="250" y="450" width="300" height="50" class="step-box"/>
  <text x="400" y="475" text-anchor="middle" class="step">6. Integration & Testing</text>
  <text x="400" y="495" text-anchor="middle" class="description">(System Integration)</text>

  <!-- Capstone -->
  <rect x="200" y="520" width="400" height="50" fill="#2ecc71" stroke="#27ae60" stroke-width="1" rx="8" ry="8"/>
  <text x="400" y="545" text-anchor="middle" class="step" fill="#ffffff">Capstone: Complete Humanoid Robot System</text>
</svg>