<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="200%" height="200%">
      <feOffset result="offOut" in="SourceAlpha" dx="3" dy="3" />
      <feGaussianBlur result="blurOut" in="offOut" stdDeviation="4" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)" />
  
  <!-- Robot arm with gripper -->
  <g transform="translate(300, 250)" filter="url(#shadow)">
    <path d="M0,0 L0,-80 L20,-100 L20,-60 Z" fill="#4db6ac" stroke="#263238" stroke-width="2"/>
    <path d="M20,-60 L40,-40 L60,-60 L40,-80 Z" fill="#81c784" stroke="#263238" stroke-width="2"/>
    <path d="M60,-60 L80,-40 L100,-60 L80,-80 Z" fill="#a5d6a7" stroke="#263238" stroke-width="2"/>
    <path d="M90,-60 L100,-40 L110,-40 L100,-60 Z" fill="#e8f5e9" stroke="#263238" stroke-width="2"/>
  </g>
  
  <!-- AI Chip -->
  <g transform="translate(500, 100)" filter="url(#shadow)">
    <rect x="-30" y="-30" width="60" height="60" rx="5" fill="#0d47a1" stroke="#000" stroke-width="2"/>
    <rect x="-20" y="-20" width="40" height="40" rx="3" fill="#1565c0" stroke="#000" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="10" font-weight="bold">AI</text>
    <rect x="-10" y="-25" width="20" height="5" rx="1" fill="#f5f5f5" />
    <rect x="-10" y="-15" width="20" height="5" rx="1" fill="#f5f5f5" />
    <rect x="-10" y="0" width="20" height="5" rx="1" fill="#f5f5f5" />
    <rect x="-10" y="10" width="20" height="5" rx="1" fill="#f5f5f5" />
  </g>
  
  <!-- Humanoid representation -->
  <g transform="translate(150, 150)" filter="url(#shadow)">
    <circle cx="0" cy="-50" r="20" fill="#ffcc80" stroke="#263238" stroke-width="2"/>
    <path d="M-15,-30 L-20,0 L20,0 L15,-30 Z" fill="#ef9a9a" stroke="#263238" stroke-width="2"/>
    <path d="M-20,0 L-40,40 L-20,35 L0,40 Z" fill="#90a4ae" stroke="#263238" stroke-width="2"/>
    <path d="M20,0 L40,40 L20,35 L0,40 Z" fill="#90a4ae" stroke="#263238" stroke-width="2"/>
    <path d="M-20,40 L-25,80 L-5,75 L0,80 L5,75 L25,80 L20,40 Z" fill="#b0bec5" stroke="#263238" stroke-width="2"/>
  </g>
  
  <!-- Neural network nodes -->
  <g fill="#ffd54f">
    <circle cx="350" cy="80" r="8" stroke="#263238" stroke-width="1"/>
    <circle cx="420" cy="60" r="8" stroke="#263238" stroke-width="1"/>
    <circle cx="480" cy="100" r="8" stroke="#263238" stroke-width="1"/>
    <circle cx="380" cy="140" r="8" stroke="#263238" stroke-width="1"/>
    <circle cx="450" cy="130" r="8" stroke="#263238" stroke-width="1"/>
    <circle cx="420" cy="180" r="8" stroke="#263238" stroke-width="1"/>
    
    <!-- Connections -->
    <line x1="350" y1="80" x2="420" y2="60" stroke="#ffd54f" stroke-width="2" opacity="0.6"/>
    <line x1="420" y1="60" x2="480" y2="100" stroke="#ffd54f" stroke-width="2" opacity="0.6"/>
    <line x1="480" y1="100" x2="450" y2="130" stroke="#ffd54f" stroke-width="2" opacity="0.6"/>
    <line x1="450" y1="130" x2="420" y2="180" stroke="#ffd54f" stroke-width="2" opacity="0.6"/>
    <line x1="350" y1="80" x2="380" y2="140" stroke="#ffd54f" stroke-width="2" opacity="0.6"/>
    <line x1="380" y1="140" x2="420" y2="180" stroke="#ffd54f" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="360" text-anchor="middle" fill="white" font-family="Arial" font-size="24" font-weight="bold">
    Physical AI &amp; Humanoid Robotics
  </text>
</svg>